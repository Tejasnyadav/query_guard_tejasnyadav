[project]
name = "queryguard"
version = "0.2.0"
description = "Trustworthy local business analytics agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
   "fastapi>=0.115,<1",
   "uvicorn[standard]>=0.30,<1",
   "psycopg[binary,pool]>=3.3,<4",
   "pydantic-settings>=2.6,<3",
   "sqlglot==30.20.0",
   "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
   "httpx>=0.27,<1",
   "pytest>=8,<10",
   "pytest-cov>=5,<8",
   "ruff>=0.9,<1",
   "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
   "integration: requires the local PostgreSQL databases",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
 